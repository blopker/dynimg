[package]
name = "dynimg"
version = "0.1.22"
edition = "2024"
description = "A fast library and CLI for rendering HTML/CSS to images"
license = "MIT"
repository = "https://github.com/blopker/dynimg"
keywords = ["html", "css", "image", "render", "screenshot"]
categories = ["multimedia::images", "rendering"]

[lib]
name = "dynimg"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dynimg"
path = "src/main.rs"

[features]
default = []
python = ["pyo3"]

[dependencies]
# Python bindings (optional)
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"], optional = true }


# Blitz rendering engine (from git - matches example.rs)
blitz-dom = { git = "https://github.com/DioxusLabs/blitz.git", rev = "4c54f2af7b0e388c31f361c42cf7712b601664f0", features = [
  "tracing",
  # CSS float layout (opt-in upstream; several float fixes landed mid-2026)
  "floats",
] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz.git", rev = "4c54f2af7b0e388c31f361c42cf7712b601664f0" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz.git", rev = "4c54f2af7b0e388c31f361c42cf7712b601664f0" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz.git", rev = "4c54f2af7b0e388c31f361c42cf7712b601664f0" }

# Anyrender - use the same version blitz uses (from crates.io)
anyrender = "0.11"
anyrender_vello_cpu = "0.14"
# Enable png feature for color emoji (SBIX bitmap) support - anyrender_vello_cpu doesn't enable it
vello_cpu = { version = "0.0.9", default-features = false, features = ["png"] }

# Graphics primitives - use the same versions anyrender uses
peniko = "0.6"
kurbo = "0.13"

# Font enumeration (same git rev as the parley patch below, so it unifies with
# blitz's parley). Direct dep for two reasons: the fontconfig-dlopen feature
# makes libfontconfig a runtime dlopen instead of a link-time dependency (so
# Linux wheels don't require fontconfig/libexpat on the host), and we need
# GenericFamily to map custom fonts as generic-family fallbacks when no system
# fonts are available.
fontique = { git = "https://github.com/linebender/parley", rev = "eccfebb22ebfa0a9f70c30c3465089aa46e7beb0", features = [
  "fontconfig-dlopen",
] }

# CLI
clap = { version = "4", features = ["derive"] }

# Image encoding
png = "0.18"
zenjpeg = "0.8"
webp = "0.3"

# Resource fetching (src/net.rs). rustls backend, NOT native-tls: native-tls
# links system OpenSSL on Linux, which manylinux containers don't ship a
# modern version of (blitz-net hard-enables native-tls, hence our own provider).
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "charset",
  "http2",
] }
# data: URI decoding
data-url = "0.3"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Tracing for debugging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# For NetProvider implementation
bytes = "1"

[profile.release]
lto = "thin"
strip = true

# Pin parley to git main for the emoji + variation-selector (VS16) fix (PR #637),
# which landed after the 0.10.0 release that blitz depends on. Without it, any
# emoji followed by U+FE0F (e.g. ❤️, ⚠️) renders as a missing-glyph box.
# Remove once a parley release > 0.10.0 with this fix is published and blitz uses it.
[patch.crates-io]
parley = { git = "https://github.com/linebender/parley", rev = "eccfebb22ebfa0a9f70c30c3465089aa46e7beb0" }

[dev-dependencies]
zensim = "0.2.7"
# Decoders for snapcmp; same version/features already compiled via blitz's tree
image = { version = "0.25.6", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
zune-jpeg = "0.5.15"
