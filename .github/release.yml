# Configuration for GitHub's auto-generated release notes
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
    authors:
      - dependabot
      - dependabot[bot]

  categories:
    - title: Breaking Changes
      labels:
        - breaking
        - breaking-change

    - title: New Features
      labels:
        - feature
        - enhancement

    - title: Bug Fixes
      labels:
        - bug
        - bugfix
        - fix

    - title: Performance
      labels:
        - performance
        - perf

    - title: Documentation
      labels:
        - documentation
        - docs

    - title: Other Changes
      labels:
        - "*"
