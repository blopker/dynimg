name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust tests and lints
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  # Snapshot tests. Most baselines (tests/snapshots/) are platform-agnostic:
  # fonts are pinned and comparison is perceptual (zensim), so macOS-generated
  # baselines pass here. Only the system-fonts test uses per-OS baselines
  # (tests/snapshots/linux) — regenerate locally with
  # ./scripts/linux-snapshots.sh --update (runs an ubuntu-latest-like
  # container; no need to pull CI artifacts).
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Run snapshot tests
        run: ./scripts/snapshot-tests.sh

      - name: Upload rendered output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-output
          path: tests/output

  # Build all wheels
  build:
    uses: ./.github/workflows/build-wheels.yml

  # Test Python wheel
  test-python:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: dist

      - name: Install wheel
        run: pip install dist/*.whl

      - name: Run tests
        run: python test_wheels/test_dynimg.py
