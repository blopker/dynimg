name: Build Wheels

on:
  workflow_call:
    inputs:
      upload-name-suffix:
        description: "Suffix for artifact names (e.g., 'ci' or 'release')"
        required: false
        default: ""
        type: string

jobs:
  # Linux x86_64 (glibc)
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --features python
          # sccache disabled: it sets CC="sccache cc" for the vendored OpenSSL
          # build, which resolves to the old system assembler (gas 2.25) instead
          # of devtoolset's (2.35) and fails on OpenSSL 3.x x86_64 asm.
          manylinux: auto
          before-script-linux: |
            # perl-* modules are needed to build vendored OpenSSL (openssl-src)
            # in the manylinux2014 container; its system OpenSSL (1.0.2) is too
            # old for openssl-sys, so we vendor a modern one (see Cargo.toml).
            yum install -y fontconfig-devel perl-IPC-Cmd perl-Data-Dumper perl-Time-Piece

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64${{ inputs.upload-name-suffix }}
          path: dist

  # Linux aarch64 (glibc)
  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --features python
          sccache: "true"
          manylinux: auto
          before-script-linux: |
            # perl-* modules are needed to build vendored OpenSSL (openssl-src)
            # in the manylinux2014 container; its system OpenSSL (1.0.2) is too
            # old for openssl-sys, so we vendor a modern one (see Cargo.toml).
            yum install -y fontconfig-devel perl-IPC-Cmd perl-Data-Dumper perl-Time-Piece

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-aarch64${{ inputs.upload-name-suffix }}
          path: dist

  # macOS (x86_64 and aarch64)
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features python
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}${{ inputs.upload-name-suffix }}
          path: dist

  # Source distribution
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist${{ inputs.upload-name-suffix }}
          path: dist
