<!DOCTYPE html>
<html>
<head>
  <meta name="dynimg:width" content="600">
  <meta name="dynimg:height" content="400">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui;
    }
    .container {
      width: 600px;
      height: 400px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }
    .emojis {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      color: white;
      font-size: 36px;
      margin-bottom: 12px;
    }
    p {
      color: rgba(255,255,255,0.9);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emojis">🚀 🎨 🔥</div>
    <h1>Emoji Rendering</h1>
    <p>Testing emoji support: 👍 ✨ 🌈 💯 🎉</p>
  </div>
</body>
</html>
