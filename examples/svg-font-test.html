<!DOCTYPE html>
<html>
<head>
  <meta name="dynimg:width" content="600">
  <meta name="dynimg:height" content="400">
  <style>
    body { margin: 0; padding: 40px; background: #f0f0f0; }
    .label { font-size: 12px; color: #666; margin-bottom: 4px; }
    .row { margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="label">SVG with font-family="system-ui"</div>
    <svg width="500" height="40"><text x="0" y="30" font-family="system-ui" font-size="28">DGJQ abc 123</text></svg>
  </div>
  <div class="row">
    <div class="label">SVG with font-family="sans-serif"</div>
    <svg width="500" height="40"><text x="0" y="30" font-family="sans-serif" font-size="28">DGJQ abc 123</text></svg>
  </div>
  <div class="row">
    <div class="label">SVG with font-family="Helvetica, Arial, sans-serif"</div>
    <svg width="500" height="40"><text x="0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="28">DGJQ abc 123</text></svg>
  </div>
  <div class="row">
    <div class="label">SVG with font-family="serif"</div>
    <svg width="500" height="40"><text x="0" y="30" font-family="serif" font-size="28">DGJQ abc 123</text></svg>
  </div>
  <div class="row">
    <div class="label">HTML with font-family: system-ui (for comparison)</div>
    <div style="font-family: system-ui; font-size: 28px;">DGJQ abc 123</div>
  </div>
</body>
</html>
