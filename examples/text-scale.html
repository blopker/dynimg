<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>

    <body>
        <style>
            .card {
                width: 400px;
                height: 250px;
                background: #1a1a1a;
                color: white;
                padding: 20px;
                /* Establish containment context */
                container-type: inline-size;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .title {
                /* 12% of the container width */
                font-size: 12cqw;
                font-weight: 800;
                text-align: center;
                margin: 0;
            }
        </style>

        <div class="card">
            <h1 class="title">SCALABLE TEXT</h1>
        </div>
    </body>
</html>
